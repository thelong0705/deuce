# Typed .EXPECT() helpers, so mock setup is checked by the compiler instead of
# matching method names as strings.
with-expecter: true

packages:
  github.com/thelong0705/deuce/internal/domain/usecase:
    config:
      dir: internal/domain/usecase/mocks
      outpkg: mocks
      mockname: "Mock{{.InterfaceName}}"
      filename: "{{.InterfaceName | snakecase}}.go"
    interfaces:
      UserCreator:
      CredentialFinder:
      SessionStore:
      PasswordHasher:
      VenueRepo:
      VenueFinder:
      CourtRepo:
      UserFinder:

  github.com/thelong0705/deuce/internal/adapter/httpapi:
    config:
      dir: internal/adapter/httpapi/mocks
      outpkg: mocks
      mockname: "Mock{{.InterfaceName}}"
      filename: "{{.InterfaceName | snakecase}}.go"
    interfaces:
      UserUsecase:
      VenueUsecase:
      CourtUsecase:

# Silence v3 deprecation warnings by opting into the future defaults now.
resolve-type-alias: false
disable-version-string: true
