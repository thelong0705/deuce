# Runs the migrations once, before the API rolls out. Needs the deuce Secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  # Retries with a growing wait, so the database not being up yet is survivable.
  backoffLimit: 6
  template:
    spec:
      # Never, not OnFailure: a failed attempt leaves its pod behind so the logs
      # outlive it.
      restartPolicy: Never
      containers:
        - name: migrate
          image: deuce-migrate
          args: ["-database=$(DB_URL)", "up"]
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: deuce
                  key: DB_URL
