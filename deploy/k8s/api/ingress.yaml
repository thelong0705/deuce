apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deuce
  annotations:
    # Reserve it first, or the Ingress never gets an address:
    #   gcloud compute addresses create deuce-ip --global
    kubernetes.io/ingress.global-static-ip-name: deuce-ip
spec:
  ingressClassName: gce
  # Everything goes to the API until there is a second Service to route to.
  defaultBackend:
    service:
      name: deuce
      port:
        number: 80
