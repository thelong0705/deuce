# kubectl apply -k deploy/k8s
# Run deploy/k8s/migrate first: this does not wait for the schema.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- api/deployment.yaml
- api/service.yaml
- api/certificate.yaml
- sweeper/deployment.yaml
- web/deployment.yaml
- web/service.yaml
- ingress.yaml

# deuce-api's newTag is written by the release workflow after each release,
# so this file states what is running and applying it by hand is safe.
images:
- name: deuce-api
  newName: asia-southeast1-docker.pkg.dev/project-deuce-509416/deuce/api
  newTag: v1.0.3
- name: deuce-web
  newName: asia-southeast1-docker.pkg.dev/project-deuce-509416/deuce/web
  newTag: v1.0.3
