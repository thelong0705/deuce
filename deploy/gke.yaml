# Everything deuce runs in the cluster: the migrations, the API and the
# sweeper. Postgres is AlloyDB and Redis is Memorystore, both reached on their
# private addresses in the same VPC, so neither is in here.
#
#   1. A range for the managed services to take their private addresses from.
#
#      gcloud compute addresses create google-managed --global \
#        --purpose=VPC_PEERING --prefix-length=16 --network=default
#      gcloud services vpc-peerings connect \
#        --service=servicenetworking.googleapis.com \
#        --ranges=google-managed --network=default
#
#   2. AlloyDB. The cluster holds the data, the instance serves it. Note the IP
#      it prints.
#
#      gcloud alloydb clusters create deuce --region=asia-southeast1 \
#        --network=default --password=PICK_ONE
#      gcloud alloydb instances create deuce --cluster=deuce \
#        --region=asia-southeast1 --instance-type=PRIMARY --cpu-count=2
#      gcloud alloydb instances describe deuce --cluster=deuce \
#        --region=asia-southeast1 --format='value(ipAddress)'
#
#   3. Memorystore. Note this IP too.
#
#      gcloud redis instances create deuce --region=asia-southeast1 \
#        --size=1 --network=default
#      gcloud redis instances describe deuce --region=asia-southeast1 \
#        --format='value(host)'
#
#   4. A GKE cluster on the same network, or the pods cannot reach either.
#
#      gcloud container clusters create-auto deuce --region=asia-southeast1 \
#        --network=default
#
#   5. The image.
#
#      REPO=asia-southeast1-docker.pkg.dev/$(gcloud config get project)/deuce
#      gcloud artifacts repositories create deuce --repository-format=docker \
#        --location=asia-southeast1
#      gcloud auth configure-docker asia-southeast1-docker.pkg.dev
#      docker build --platform linux/amd64 -t $REPO/api:v1 . && docker push $REPO/api:v1
#
#   6. The two addresses from steps 2 and 3, and the migrations.
#
#      kubectl create secret generic deuce \
#        --from-literal=DB_URL='postgres://postgres:PICK_ONE@ALLOYDB_IP:5432/postgres?sslmode=require' \
#        --from-literal=REDIS_ADDR='MEMORYSTORE_IP:6379'
#      kubectl create configmap migrations --from-file=db/postgres/migration
#
#   7. Deploy, then wait for a public address.
#
#      sed "s|IMAGE|$REPO/api:v1|" deploy/gke.yaml | kubectl apply -f -
#      kubectl get service deuce --watch
#
# Then http://EXTERNAL-IP/healthz answers {"status":"ok"}.
#
# REDIS_ADDR is not a secret. It shares the Secret with DB_URL because one
# object is one command, and splitting them buys nothing here.

---
# Migrations run here, not when the API starts. Two API pods starting together
# would both try, and racing to change a schema is the thing this avoids.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          args: ["-path=/migration", "-database=$(DB_URL)", "up"]
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: deuce
                  key: DB_URL
          volumeMounts:
            - name: migrations
              mountPath: /migration
      volumes:
        - name: migrations
          configMap:
            name: migrations
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deuce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deuce
  template:
    metadata:
      labels:
        app: deuce
    spec:
      containers:
        - name: api
          image: IMAGE
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          # DB_URL and REDIS_ADDR, both from the Secret made in step 6.
          envFrom:
            - secretRef:
                name: deuce
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# The sweeper releases holds nobody paid for. Same image as the API, different
# binary, so a deploy is one build and one tag.
#
# One replica: a second would do the same work over again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sweeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sweeper
  template:
    metadata:
      labels:
        app: sweeper
    spec:
      containers:
        - name: sweeper
          image: IMAGE
          command: ["/sweeper"]
          envFrom:
            - secretRef:
                name: deuce
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# LoadBalancer asks Google for a public IP and points it here. An Ingress would
# add HTTPS and a domain; this is the version with nothing to configure.
apiVersion: v1
kind: Service
metadata:
  name: deuce
spec:
  type: LoadBalancer
  selector:
    app: deuce
  ports:
    - port: 80
      targetPort: http
