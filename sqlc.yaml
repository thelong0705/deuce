version: "2"
sql:
    - engine: "postgresql"
      queries: "./db/postgres/query"
      schema: "./db/postgres/migration"
      gen:
          go:
              package: "postgres"
              out: "internal/adapter/postgres"
              sql_package: "pgx/v5"
              emit_interface: false
              emit_json_tags: true
              emit_empty_slices: true
              overrides:
                  - db_type: "citext"
                    go_type: "string"
                  - db_type: "uuid"
                    go_type: "github.com/google/uuid.UUID"
                  - db_type: "uuid"
                    nullable: true
                    go_type: "github.com/google/uuid.NullUUID"
