profile: coverage.out

local-prefix: "github.com/thelong0705/deuce"

threshold:
  package: 80

exclude:
  paths:
    - ^cmd/
    - ^e2e/
    # mockery output, in any package
    - /mocks/
    # sqlc output. The repositories that wrap it are still measured; what is
    # excluded is generated scanning and error plumbing nobody wrote.
    - ^internal/adapter/postgres/(db|models)\.go$
    - \.sql\.go$
