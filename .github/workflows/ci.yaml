# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: deuce
          POSTGRES_PASSWORD: deuce
          POSTGRES_DB: deuce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run migrations
        run: make migrate-up MIGRATE_NETWORK=host

      - name: Build
        run: go build -v ./...

      - name: Test
        run: make test

      # Fails the job when a package falls below the .testcoverage.yml threshold.
      - name: Coverage
        run: make cover-check
