name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'db/**'
              - 'Makefile'
              - 'sqlc.yaml'
              - '.golangci.yml'
              - '.mockery.yaml'
              - '.testcoverage.yml'
              - '.github/workflows/ci.yaml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yaml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Format
        run: make fmt-check

      - name: Lint
        run: make lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: deuce
          POSTGRES_PASSWORD: deuce
          POSTGRES_DB: deuce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run migrations
        run: make migrate-up MIGRATE_NETWORK=host

      - name: Test
        run: make test

      - name: Coverage
        run: make cover-check

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [ changes, lint, build, test, web ]
    if: always()
    steps:
      - name: Check the jobs that ran
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            || { echo "::error::a required job did not pass"; exit 1; }
