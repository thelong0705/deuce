name: Release

# A tag is the release. Merging to main changes nothing in the cluster.
on:
  push:
    tags: [ "v*" ]

jobs:

  release:
    name: Release
    runs-on: ubuntu-latest
    # One at a time, and never cancelled midway: a half-applied rollout is
    # worse than a queued one.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      id-token: write
    env:
      REGION: asia-southeast1
      CLUSTER: deuce
      REPO: asia-southeast1-docker.pkg.dev/project-deuce-509416/deuce
    steps:
      - uses: actions/checkout@v4
        with:
          # A deploy key, because GITHUB_TOKEN cannot be given a bypass on the
          # pull_request rule: that actor is organization-only.
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      # Keyless: GitHub mints a short-lived OIDC token and Google trades it for
      # credentials. No service account key to store, leak or rotate.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: kubectl, gke-gcloud-auth-plugin

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: Install kustomize
        run: |
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin

      - name: Build and push
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$REPO/api:$GITHUB_REF_NAME" .
          docker build -f Dockerfile.migrate -t "$REPO/migrate:$GITHUB_REF_NAME" .
          docker build -t "$REPO/web:$GITHUB_REF_NAME" web/
          docker push "$REPO/api:$GITHUB_REF_NAME"
          docker push "$REPO/migrate:$GITHUB_REF_NAME"
          docker push "$REPO/web:$GITHUB_REF_NAME"

      - name: Deploy
        run: |
          cd deploy/k8s
          kustomize edit set image "deuce-api=$REPO/api:$GITHUB_REF_NAME"
          kustomize edit set image "deuce-web=$REPO/web:$GITHUB_REF_NAME"
          cd - >/dev/null
          kubectl apply -k deploy/k8s
          kubectl rollout status deployment/deuce --timeout=5m
          kubectl rollout status deployment/sweeper --timeout=5m
          kubectl rollout status deployment/web --timeout=5m

      # After the rollout, so a failed release never records an image that is
      # not running.
      - name: Record the released version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cd deploy/k8s
          kustomize edit set image "deuce-api=$REPO/api:$GITHUB_REF_NAME"
          kustomize edit set image "deuce-web=$REPO/web:$GITHUB_REF_NAME"
          cd - >/dev/null
          git add deploy/k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "already recorded"
          else
            git commit -m "Release $GITHUB_REF_NAME"
            git push origin main
          fi

      - name: Summary
        run: |
          {
            echo "Released \`$GITHUB_REF_NAME\` to $CLUSTER"
            echo ""
            echo "Migrations are run by hand:"
            echo '```'
            echo "cd deploy/k8s/migrate && kustomize edit set image deuce-migrate=$REPO/migrate:$GITHUB_REF_NAME"
            echo "kubectl delete job migrate --ignore-not-found"
            echo "kubectl apply -k deploy/k8s/migrate"
            echo "kubectl wait --for=condition=complete job/migrate --timeout=5m"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
